<div class="book">
  <img
    src="{{ book.img_url }}"
    alt="`{{ book.title }} by {{ book.author }}`"
  />
  <div class="book-content">
    <p class="title">{{ book.title }}</p>
    <div class="meta">
      <p class="author">{{ book.author }}</p>
      <p class="publishYear">{{ book.publish_year }}</p>
      <p class="isbn">{{ book.isbn_h }}</p>
    </div>
  </div>
</div>
